<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250">
<style>
svg{--bg:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--t3:#8a8984;--grid:#e6e5e0;--s1:#2a78d6;--s2:#eb6834;--box:#f3f2ee;--line:#bdbcb6}
@media (prefers-color-scheme: dark){svg{--bg:#1a1a19;--t1:#f0efec;--t2:#c3c2b7;--t3:#8f8e88;--grid:#2e2e2c;--s1:#3987e5;--s2:#d95926;--box:#242423;--line:#55554f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.t{fill:var(--t1);font-size:17px;font-weight:600}.st{fill:var(--t2);font-size:13px}
.lab{fill:var(--t1);font-size:13px}.val{fill:var(--t1);font-size:12px;font-weight:600}.ax{fill:var(--t3);font-size:11px}
</style>
<rect width="760" height="250" rx="10" style="fill:var(--bg)"/>
<text x="24" y="38" class="t">Clone tickets finished in one shot</text>
<text x="24" y="60" class="st">Fresh worker per ticket, graded by hidden browser journeys against the original app.</text>
<line x1="250.0" y1="80" x2="250.0" y2="216" style="stroke:var(--grid);stroke-width:1"/><text x="250.0" y="234" text-anchor="middle" class="ax">0%</text>
<line x1="360.0" y1="80" x2="360.0" y2="216" style="stroke:var(--grid);stroke-width:1"/><text x="360.0" y="234" text-anchor="middle" class="ax">25%</text>
<line x1="470.0" y1="80" x2="470.0" y2="216" style="stroke:var(--grid);stroke-width:1"/><text x="470.0" y="234" text-anchor="middle" class="ax">50%</text>
<line x1="580.0" y1="80" x2="580.0" y2="216" style="stroke:var(--grid);stroke-width:1"/><text x="580.0" y="234" text-anchor="middle" class="ax">75%</text>
<line x1="690.0" y1="80" x2="690.0" y2="216" style="stroke:var(--grid);stroke-width:1"/><text x="690.0" y="234" text-anchor="middle" class="ax">100%</text>
<text x="236" y="102.0" text-anchor="end" class="lab">Skill as first written (app 3)</text><path d="M250,86 H646.0 Q650.0,86 650.0,90 V104 Q650.0,108 646.0,108 H250 Z" style="fill:var(--s1)"/><text x="658.0" y="101.0" class="val">10/11</text>
<text x="236" y="136.0" text-anchor="end" class="lab">Improved prompt, Opus 5.5</text><path d="M250,120 H686.0 Q690.0,120 690.0,124 V138 Q690.0,142 686.0,142 H250 Z" style="fill:var(--s1)"/><text x="698.0" y="135.0" class="val">11/11</text>
<text x="236" y="170.0" text-anchor="end" class="lab">Improved prompt, Fable 5.2</text><path d="M250,154 H686.0 Q690.0,154 690.0,158 V172 Q690.0,176 686.0,176 H250 Z" style="fill:var(--s1)"/><text x="698.0" y="169.0" class="val">11/11</text>
<text x="236" y="204.0" text-anchor="end" class="lab">Clone generated from recordings</text><path d="M250,188 H642.0 Q646.0,188 646.0,192 V206 Q646.0,210 642.0,210 H250 Z" style="fill:var(--s1)"/><text x="654.0" y="203.0" class="val">9/10</text>
</svg>